[project]
name = "outbound-ai"
version = "0.1.0"
description = "Arabic AI-powered outbound follow-up calls with multi-tenant routing and a RAG knowledge assistant"
readme = "README.md"
requires-python = ">=3.11,<3.13"

dependencies = [
    # Backend and UI
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "gradio==5.35.0",
    "sentence-transformers>=3.0.0,<6.0.0",

    # Authentication, PostgreSQL, Supabase REST, and pgvector
    "PyJWT[crypto]>=2.9.0",
    "psycopg[binary,pool]>=3.2.0",
    "pgvector>=0.3.6",
    "requests>=2.32.0",

    # Gemini/OpenAI-compatible LLM and embeddings
    "openai>=1.55.0",

    # RAG/document ingestion
    "pypdf>=5.0.0",
    "python-docx>=1.1.2",

    # Vonage and application runtime
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
local-voice = [
    "faster-whisper>=1.1.0",
    "transformers>=4.45.0",
    "torch>=2.2.0",
    "scipy>=1.12.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/outbound_ai"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
