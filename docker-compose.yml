services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    command: uvicorn outbound_ai.api.app:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  ui:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      API_BASE_URL: http://api:8000
      GRADIO_SERVER_NAME: 0.0.0.0
      GRADIO_PORT: 7860
    command: python -m outbound_ai.ui.app
    ports:
      - "7860:7860"
    depends_on:
      api:
        condition: service_healthy

  scheduler:
    build: .
    restart: unless-stopped
    env_file: .env
    command: python scripts/run_scheduler.py
    depends_on:
      api:
        condition: service_healthy
